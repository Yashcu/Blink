name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Shorty/backend/**' # Only trigger if backend changes
  pull_request:
    branches: [ "main" ] # Only trigger if backend changes
    paths:
      - 'Shorty/backend/**'

jobs:
  quality-check:
    name: 🛡️ Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Shorty/backend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Shorty/backend/package-lock.json

    - name: Install Dependencies
      # We use 'npm ci' for strict checking. 
      # If this fails, it means your package-lock.json is not synced with package.json.
      run: npm ci

    - name: 🚨 Lint Check
      run: npm run lint
      # Fails if there are eslint errors

    - name: 🏗️ Build Check
      run: npm run build
      # Fails if TypeScript doesn't compile

  docker-build:
    name: 🐳 Docker Build Test
    runs-on: ubuntu-latest
    needs: quality-check # Only run if quality checks pass
    defaults:
      run:
        working-directory: ./Shorty/backend
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        # We don't push to a registry yet, we just verify it BUILDS.
        run: docker build . --file Dockerfile --tag shorty-backend:test