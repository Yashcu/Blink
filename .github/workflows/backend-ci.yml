name: Backend CI

on:
  workflow_dispatch: 
  
  push:
    branches: [ "main" ]
    paths:
      - 'Shorty/backend/**'
      - '.github/workflows/backend-ci.yml'
  
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Shorty/backend/**'

jobs:
  quality-check:
    name: 🛡️ Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Shorty/backend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '**/backend/package-lock.json'

    - name: Install Dependencies
      run: npm ci

    - name: 🚨 Lint Check
      run: npm run lint

    - name: 🏗️ Build Check
      run: npm run build

  docker-build:
    name: 🐳 Docker Build Test
    runs-on: ubuntu-latest
    needs: quality-check
    defaults:
      run:
        working-directory: ./Shorty/backend
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build . --file Dockerfile --tag shorty-backend:test